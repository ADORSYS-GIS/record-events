events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Upstream to backend service via ALB (ECS environment)
    # Note: API requests will be handled by ALB routing rules, not nginx proxy

    # Note: File uploads handled directly via AWS S3 SDK, no proxy needed

    # HTTP server: serve application (ALB handles SSL termination)
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Additional headers
        add_header Access-Control-Allow-Origin '*' always;

        # Health check endpoint - ALB will route /health to nginx, 
        # but actual API health checks go to /api/health via ALB routing
        location /health {
            return 200 'nginx healthy';
            add_header Content-Type text/plain;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback: serve index.html for all other routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS handled by ALB - no HTTPS server block needed

}