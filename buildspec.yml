version: 0.2

phases:
  install:
    runtime-versions:
      docker: 24
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  pre_build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker images...
      - FRONTEND_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_IMAGE_REPO_NAME
      - MIDDLEWARE_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$MIDDLEWARE_IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG="latest"

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker images...
      - docker build -t $FRONTEND_IMAGE_REPO_NAME:latest .
      - docker build -f eventserver/Dockerfile -t $MIDDLEWARE_IMAGE_REPO_NAME:latest eventserver/
      - docker tag $FRONTEND_IMAGE_REPO_NAME:latest $FRONTEND_REPOSITORY_URI:latest
      - docker tag $MIDDLEWARE_IMAGE_REPO_NAME:latest $MIDDLEWARE_REPOSITORY_URI:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $FRONTEND_REPOSITORY_URI:latest
      - docker push $MIDDLEWARE_REPOSITORY_URI:latest
      - echo Build completed successfully
