[package]
name = "eventserver"
version = "0.1.0"
edition = "2021"
description = "Stateless EventServer backend for the EventApp ecosystem"
authors = ["EventApp Team"]

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime and HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Cryptography
sha2 = "0.10"
p256 = "0.13"
base64 = "0.21"


# Storage (S3-compatible via MinIO)
# minio = "0.2"
aws-sdk-s3 = "0.31"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Configuration management
dotenvy = "0.15"
envconfig = "0.10"

# JSON Web Tokens for certificates
jsonwebtoken = "9.0"
josekit = "0.10.3"

# Additional utilities
rand = "0.8"

# OpenAPI documentation
utoipa = { version = "4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

[dev-dependencies]
# Random number generation for testing
rand = "0.8"
